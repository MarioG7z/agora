[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agora"
version = "0.1.0"
description = "Multi-agent harness that plans, specifies, implements and audits software tasks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "rich>=13.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Async tests must be marked explicitly with @pytest.mark.asyncio (strict mode).
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # import sorting
    "B",     # common bug patterns
    "UP",    # modern Python syntax
    "SIM",   # simplifications
    "ASYNC", # blocking calls inside async code
    "RUF",   # ruff-specific checks
]
